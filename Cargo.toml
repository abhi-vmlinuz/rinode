[package]
name = "rinode"
version = "0.1.0"
edition = "2021"
description = "Zero-copy deleted file tracking and instant restoration for Linux"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7.1"
ratatui = "0.29"
crossterm = "0.28"
