theme = "cyberpunk"

[storage]
retention_days = 30
max_storage_bytes = 21474836480

[exclusions]
system_paths = [
    "/proc",
    "/sys",
    "/dev",
    "/run",
    "/tmp",
]
path_regex = [
    ".*/node_modules/.*",
    '.*/\.git/.*',
    ".*/target/(debug|release)/.*",
    ".*/build/.*",
    '.*/\.cache/.*',
    ".*/__pycache__/.*",
]
filename_regex = [
    '^\..*\.swp$',
    ".*~$",
    '.*\.tmp$',
    '^core(\.\d+)?$',
    '^\.~lock\..*#$',
]
