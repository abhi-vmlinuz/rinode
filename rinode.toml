theme = "solarized"

[storage]
retention_days = 30
# Max bytes kept in PRESERVED status (oldest-first auto-prune on `rm`). 0 = unlimited.
max_storage_bytes = 21474836480 # 20 GiB

[exclusions]
system_paths = [
    "/proc",
    "/sys",
    "/dev",
    "/run",
    "/tmp",
]

path_regex = [
    ".*/node_modules/.*",
    ".*/\\.git/.*",
    ".*/target/(debug|release)/.*",
    ".*/build/.*",
    ".*/\\.cache/.*",
    ".*/__pycache__/.*",
]

filename_regex = [
    "^\\..*\\.swp$",
    ".*~$",
    ".*\\.tmp$",
    "^core(\\.\\d+)?$",
    "^\\.~lock\\..*#$",
]
